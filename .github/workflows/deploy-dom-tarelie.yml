name: TARELIE Dom | REG.RU FTPS

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-dom-tarelie.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read-only check; deploy = publish'
        required: true
        type: choice
        options:
          - plan
          - deploy
        default: plan

permissions:
  contents: read

concurrency:
  group: tarelie-dom-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: server169.hosting.reg.ru
      FTP_USER: u3652448_dom
      FTP_PASSWORD: ${{ secrets.TARELIE_FTP_PASSWORD }}
      EXPECTED_DOMAIN: dom.tarelie.ru
      EXPECTED_HOSTING_DIR: /www/dom.tarelie.ru
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (contains(github.event.head_commit.message, '[plan-tarelie]') && 'plan' || 'deploy') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate only TARELIE project
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lsevmos-gpt/tarelie-dom"
          test "$FTP_USER" = "u3652448_dom"
          test "$EXPECTED_HOSTING_DIR" = "/www/dom.tarelie.ru"
          test -s site/index.html
          test "$(find site/assets -type f | wc -l)" -eq 15
          grep -Fq "ТАРЕЛЬЕ" site/index.html
          if grep -qE 'data:image/(png|webp|jpeg);base64,' site/index.html; then
            echo "::error::Embedded image unexpectedly present in extracted site"
            exit 1
          fi
          case "$MODE" in plan|deploy) :;; *) exit 1;; esac
          echo "Validated independent TARELIE website; mode=$MODE"

      - name: Require FTP secret
        shell: bash
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::TARELIE_FTP_PASSWORD secret is not configured"
            exit 1
          fi

      - name: Install FTPS client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Inspect dedicated FTP account without making changes
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 25;
            pwd;
            cls -1 -a;
            bye
          " > /tmp/tarelie-root-listing.txt
          echo "FTP_CONNECTED=yes"
          cat /tmp/tarelie-root-listing.txt

      - name: Plan only
        if: env.MODE == 'plan'
        shell: bash
        run: |
          echo "PLAN_ONLY=yes; no remote write"
          find site -type f | sort

      - name: Guard remote directory before first upload
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 20;
            get .tarelie-dom-root.txt -o /tmp/tarelie-root-marker.txt;
            bye
          " && marker_present=yes || marker_present=no
          if [[ "$marker_present" == "yes" ]]; then
            test "$(tr -d '\r\n' < /tmp/tarelie-root-marker.txt)" = "$EXPECTED_DOMAIN" || {
              echo "::error::FTP account root marker is for another domain"
              exit 1
            }
            echo "DOMAIN_MARKER=verified"
          else
            # A first-time deployment is permitted only to an empty, separately restricted FTP root.
            grep -Ev '^(/|/www/dom.tarelie.ru/?|\.|\.\.|\.well-known)?$' /tmp/tarelie-root-listing.txt > /tmp/tarelie-other-files.txt || true
            if [[ -s /tmp/tarelie-other-files.txt ]]; then
              echo "::error::FTP root contains files and no TARELIE marker. Refusing initial deployment."
              exit 1
            fi
            echo "EMPTY_TARGET=verified; first deployment permitted"
          fi

      - name: Back up existing remote files
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tarelie_backup
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 25;
            mirror --verbose --no-perms --exclude-glob '.*' ./ _tarelie_backup/;
            bye
          "

      - name: Preserve backup artifact
        if: env.MODE == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: tarelie-backup-${{ github.run_id }}
          path: _tarelie_backup/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish only TARELIE site (no delete)
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          printf "%s\n" "$EXPECTED_DOMAIN" > /tmp/tarelie-dom-root.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 25;
            mirror -R --verbose --no-perms site/ ./;
            put /tmp/tarelie-dom-root.txt -o .tarelie-dom-root.txt;
            bye
          "
          echo "UPLOAD_COMPLETE=yes"

      - name: Verify HTTPS production content
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 4 --connect-timeout 10 --max-time 45 \
            "https://dom.tarelie.ru/?check=${GITHUB_SHA}" -o /tmp/tarelie-live.html
          cmp -s site/index.html /tmp/tarelie-live.html || {
            echo "::error::Live homepage does not match published source"
            exit 1
          }
          test -s site/assets/img-b314a1bb70f8e2a7.png
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 \
            "https://dom.tarelie.ru/assets/img-b314a1bb70f8e2a7.png" -o /tmp/tarelie-live-logo.png
          cmp -s site/assets/img-b314a1bb70f8e2a7.png /tmp/tarelie-live-logo.png
          echo "TARELIE_LIVE_VERIFIED=yes"
