name: Deploy TARELIE Dom to REG.RU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-dom-tarelie.yml'

permissions:
  contents: read

concurrency:
  group: tarelie-dom-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: server169.hosting.reg.ru
      FTP_USER: u3652448_dom
      FTP_PASSWORD: ${{ secrets.TARELIE_FTP_PASSWORD }}
      DOMAIN: dom.tarelie.ru
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Validate TARELIE sources and dedicated FTP account
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lsevmos-gpt/tarelie-dom"
          test "$FTP_HOST" = "server169.hosting.reg.ru"
          test "$FTP_USER" = "u3652448_dom"
          test "$DOMAIN" = "dom.tarelie.ru"
          test -s site/index.html
          test "$(find site/assets -type f | wc -l)" -ge 1
          grep -Fq 'ТАРЕЛЬЕ' site/index.html
          test -n "$FTP_PASSWORD"

      - name: Install FTPS client used on existing REG.RU sites
        run: sudo apt-get update -qq && sudo apt-get install -qq -y lftp

      - name: Verify dedicated directory and save existing homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tarelie_backup
          if lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            cd /;
            get .tarelie-dom-root.txt -o /tmp/tarelie-marker.txt;
            bye
          "; then
            test "$(tr -d '\r\n' < /tmp/tarelie-marker.txt)" = "$DOMAIN" || {
              echo '::error::Wrong site root marker. Nothing will be overwritten.'
              exit 1
            }
          else
            lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
              set cmd:fail-exit true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:passive-mode true;
              set ssl:verify-certificate true;
              cd /;
              get index.html -o /tmp/tarelie-original-index.html;
              bye
            "
            echo '54de7429672546e5ad06d1cab90c5699b140c2542963d7acfaa68ebb74973ac4  /tmp/tarelie-original-index.html' | sha256sum -c -
            grep -Fq 'Почти готово! Домен успешно привязан к хостингу' /tmp/tarelie-original-index.html
          fi
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            cd /;
            get index.html -o _tarelie_backup/index.html;
            bye
          "

      - name: Preserve original homepage
        uses: actions/upload-artifact@v4
        with:
          name: tarelie-homepage-before-${{ github.run_id }}
          path: _tarelie_backup/index.html
          retention-days: 14

      - name: Publish site over protected REG.RU FTPS
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$DOMAIN" > /tmp/tarelie-dom-root.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            cd /;
            mirror -R --verbose --no-perms site/ ./;
            put /tmp/tarelie-dom-root.txt -o .tarelie-dom-root.txt;
            bye
          "

      - name: Verify exact homepage uploaded
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            cd /;
            get index.html -o /tmp/tarelie-published.html;
            bye
          "
          cmp -s site/index.html /tmp/tarelie-published.html
          echo 'TARELIE_FTPS_PUBLICATION=verified'

      - name: Verify public HTTPS when DNS is ready
        shell: bash
        run: |
          set -euo pipefail
          if ! getent ahostsv4 "$DOMAIN" >/dev/null; then
            echo '::warning::FTP is published, but dom.tarelie.ru DNS is not configured yet.'
            exit 0
          fi
          if ! curl -fsSL --connect-timeout 10 --max-time 30 "https://$DOMAIN/?check=${GITHUB_SHA}" -o /tmp/tarelie-live.html; then
            echo '::warning::FTP is published, but HTTPS or SSL is not ready yet.'
            exit 0
          fi
          cmp -s site/index.html /tmp/tarelie-live.html || {
            echo '::error::The public website does not match the published files.'
            exit 1
          }
          echo 'TARELIE_PUBLIC_HTTPS=verified'
